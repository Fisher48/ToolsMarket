# ============================================
# 0. ЗАГЛУШКА: запросы по IP и левые домены
# ============================================
server {
    listen 80 default_server;
    server_name _;

    location = /stub_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.18.0.0/16;
        deny all;
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/18wolt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/18wolt.ru/privkey.pem;

    location = /stub_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.18.0.0/16;
        deny all;
    }

    location / {
        return 444;
    }
}

# ============================================
# 1. СТАРЫЕ ДОМЕНЫ (HTTPS → редирект на 18wolt.ru)
# ============================================
server {
    listen 443 ssl;
    server_name toolsmarket48.ru www.toolsmarket48.ru
                18волт.рф www.18волт.рф;

    ssl_certificate     /etc/letsencrypt/live/18wolt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/18wolt.ru/privkey.pem;

    location / {
        return 301 https://18wolt.ru$request_uri;
    }
}

# ============================================
# 2. HTTP → HTTPS
# ============================================
server {
    listen 80;
    server_name 18wolt.ru www.18wolt.ru
                toolsmarket48.ru www.toolsmarket48.ru
                18волт.рф www.18волт.рф;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /stub_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.18.0.0/16;
        deny all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================
# 3. ОСНОВНОЙ HTTPS
# ============================================
server {
    listen 443 ssl;
    http2 on;
    server_name 18wolt.ru www.18wolt.ru;

    ssl_certificate     /etc/letsencrypt/live/18wolt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/18wolt.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    # =========================
    # SECURITY HEADERS
    # =========================
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    add_header Content-Security-Policy "default-src 'self' https: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://www.google.com https://www.gstatic.com https://recaptcha.google.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: https: http:; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://cdn.jsdelivr.net https://www.google.com https://www.recaptcha.net https://18wolt.ru http://18wolt.ru https://cdnjs.cloudflare.com; frame-src https://www.google.com;" always;

    # =========================
    # 3.1 ЗАЩИТА ОТ СКАНЕРОВ (до прокси)
    # =========================

    # WordPress / PHP / популярные сканеры
    location ~* ^/(wp-admin|wp-content|wp-includes|xmlrpc\.php|wp-login\.php|wordpress|admin\.php|cache\.php|about\.php|shell\.php|config\.php) {
        return 444;
    }

    location ~ \.php$ {
        return 444;
    }

    # Скрытые файлы (.env, .git, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Блокировка .git и .env
    location ~* /\.(git|env|svn|idea) {
        return 444;
    }

    # Сканеры vendor / composer / node_modules
    location ~* ^/(vendor|composer\.|node_modules|package\.json|package-lock\.json) {
        return 444;
    }

    # =========================
    # 3.2 СТАТИКА (nginx отдаёт сам, Spring не грузим)
    # =========================

    location = /robots.txt {
        alias /var/www/static/robots.txt;
        access_log off;
        expires 1d;
    }

    location = /sitemap.xml {
        proxy_pass http://tools-market-app:8080/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        expires 1h;
    }

    location = /site.webmanifest {
        proxy_pass http://tools-market-app:8080/site.webmanifest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        expires 1d;
        add_header Content-Type application/manifest+json;
    }

    location ~* ^/(favicon|apple-touch-icon|android-chrome|mstile) {
        root /var/www/static/icons;
        access_log off;
        expires 30d;
        try_files $uri $uri/ =404;
    }

    # =========================
    # 3.3 UPLOADS
    # =========================
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # =========================
    # 3.4 PROMETHEUS stub_status
    # =========================
    location = /stub_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.18.0.0/16;
        deny all;
    }

    # =========================
    # 3.5 GRAFANA
    # =========================
    location /grafana/ {
        auth_basic "18wolt Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://grafana:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /grafana;

        proxy_http_version 1.1;

        # Прокидываем авторизацию в Grafana (чтобы не спрашивать 2 раза)
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # =========================
    # 3.6 PROMETHEUS
    # =========================
    location ~ ^/(graph|alerts|targets|status|metrics|config|flags|rules|service-discovery|federate)/? {
        auth_basic "18wolt Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://prometheus:9090;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    # API запросы
    location ~ ^/api/v1/ {
        # Только для internal network
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://prometheus:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    # Prometheus с префиксом /prometheus
    location /prometheus/ {
        auth_basic "18wolt Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd;

        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass http://prometheus:9090;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://prometheus:9090/ /prometheus/;
        proxy_redirect / /prometheus/;
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    # =========================
    # 3.7 ALERTMANAGER
    # =========================
    # location /alertmanager/ {
    #     auth_basic "18wolt Monitoring";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #     rewrite ^/alertmanager/(.*)$ /$1 break;
    #     proxy_pass http://alertmanager:9093;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # =========================
    # 3.8 BACKEND (Spring Boot)
    # =========================
    location /order {
        limit_req zone=order_limit burst=5;
        limit_conn conn_limit 10;
        proxy_pass http://tools-market-app:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://tools-market-app:8080;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
