<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>18Вольт — Интернет-магазин инструментов</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Swiper для баннеров -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <link rel="icon" type="image/png" href="/smallLogo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <style>
    :root {
      --primary: #0d1b2a;
      --primary-dark: #1b263b;
      --primary-light: #2a3a4d;
      --accent: #FFD600;
      --accent-light: #FFE033;
      --accent-dark: #E6C200;
      --text: #1a1a1a;
      --text-light: #5a5a5a;
      --bg: #FFFFFF;
      --bg-alt: #F5F6F8;
      --card-bg: #FFFFFF;
      --border: #E0E4E8;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.1);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #F8FAFC 0%, #F1F5F9 100%);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ========== HERO ========== */
    .hero-parallax {
      position: relative;
      height: 340px;
      min-height: 280px;
      display: flex;
      align-items: center;
      margin: 20px 0 40px;
      border-radius: 32px;
      overflow: hidden;
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 60%, #2a3a4d 100%);
      box-shadow: var(--shadow-lg);
    }

    .hero-parallax::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      animation: slide 25s linear infinite;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 50px 60px;
      color: white;
      width: 100%;
    }

    .hero-content h2 {
      font-size: 2.6rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 16px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .hero-content .lead {
      font-size: 1.25rem;
      opacity: 0.9;
      margin-bottom: 32px;
      color: rgba(255,255,255,0.85);
    }

    .hero-btn {
      background: var(--accent);
      border: 2px solid var(--accent);
      border-radius: 50px;
      padding: 14px 40px;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .hero-btn:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(255, 214, 0, 0.35);
      color: var(--text);
    }

    .hero-logo-wrap {
      /*background: rgba(255,255,255,0.96);*/
      padding: 28px 36px;
      border-radius: 24px;
      /*box-shadow: 0 8px 32px rgba(0,0,0,0.25);*/
      display: inline-block;
    }

    .hero-logo-wrap img {
      height: 250px;
      width: auto;
      display: block;
    }

    @keyframes slide {
      from { background-position: 0 0; }
      to { background-position: 100% 100%; }
    }

    /* ========== БАННЕР ========== */
    .banner-premium {
      margin: 40px 0;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }

    .banner-swiper {
      width: 100%;
      height: 350px;
    }

    .banner-slide {
      position: relative;
      overflow: hidden;
    }

    .banner-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 6s ease;
    }

    .banner-slide:hover img {
      transform: scale(1.1);
    }

    .banner-slide::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, rgba(0,0,0,0.4) 0%, transparent 50%);
    }

    .banner-content {
      position: absolute;
      bottom: 40px;
      left: 40px;
      color: white;
      z-index: 2;
      max-width: 500px;
    }

    .banner-content h3 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .swiper-button-next, .swiper-button-prev {
      color: white;
      background: var(--accent);
      width: 50px;
      height: 50px;
      border-radius: 25px;
      opacity: 0.9;
      transition: var(--transition);
    }

    .swiper-button-next:hover, .swiper-button-prev:hover {
      background: var(--accent-dark);
      opacity: 1;
      transform: scale(1.1);
    }

    .swiper-button-next::after, .swiper-button-prev::after {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
    }

    /* ========== ЗАГОЛОВКИ ========== */
    .section-header {
      text-align: center;
      margin: 60px 0 40px;
    }

    .section-header h2 {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 16px;
      position: relative;
      display: inline-block;
    }

    .section-header h2::before {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-dark));
      border-radius: 2px;
    }

    .section-header p {
      color: var(--text-light);
      font-size: 1.15rem;
      max-width: 600px;
      margin: 24px auto 0;
    }

    /* ========== КАРТОЧКИ КАТЕГОРИЙ ========== */
    .premium-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 40px;
      position: relative;
    }

    .category-card {
      transition: transform 0.2s, box-shadow 0.2s;
      height: 100%;
      cursor: pointer;
    }

    .category-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(255, 214, 0, 0.12);
    }

    .category-card .card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      word-wrap: break-word;
      background-color: #fff;
      background-clip: border-box;
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      transition: var(--transition);
      height: 100%;
      box-shadow: var(--shadow-sm);
    }

    .category-card:hover .card {
      border-color: var(--accent);
    }

    .category-card .card-body {
      flex: 1 1 auto;
      min-height: 1px;
      padding: 1.5rem;
    }

    .category-card .text-center {
      text-align: center;
    }

    .category-card .mb-3 {
      margin-bottom: 1rem;
    }

    .category-card .img-fluid {
      max-width: 100%;
      height: auto;
    }

    .category-card .rounded {
      border-radius: 0.25rem;
    }

    .category-card .category-icon-placeholder {
      background: var(--bg-alt);
      border-radius: 16px;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    .category-card .category-icon-placeholder i {
      color: var(--accent);
      font-size: 3rem;
    }

    .category-card .card-title {
      margin-bottom: 0.75rem;
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--primary);
      transition: var(--transition);
    }

    .category-card:hover .card-title {
      color: var(--primary-light);
    }

    .category-card .text-decoration-none {
      text-decoration: none;
      color: inherit;
    }

    .category-card a:hover {
      color: inherit;
    }

    .category-count {
      color: var(--text-light);
      font-size: 0.95rem;
    }

    /* ========== ПУСТОЕ СОСТОЯНИЕ ========== */
    .empty-state-premium {
      background: white;
      border-radius: 24px;
      padding: 80px 20px;
      text-align: center;
      box-shadow: var(--shadow-md);
      margin: 40px 0;
      border: 1px solid var(--border);
    }

    .empty-state-premium i {
      font-size: 4rem;
      color: var(--accent);
      margin-bottom: 20px;
      opacity: 0.6;
    }

    .empty-state-premium h3 {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .empty-state-premium p {
      color: var(--text-light);
      font-size: 1.1rem;
    }

    /* ========== АДАПТАЦИЯ ========== */
    @media (max-width: 992px) {
      .hero-content h2 { font-size: 2rem !important; }
      .section-header h2 { font-size: 2rem !important; }
      .hero-logo-wrap { padding: 20px 28px; }
      .hero-logo-wrap img { height: 140px; }
    }

    @media (max-width: 768px) {
      .hero-content { padding: 30px !important; }
      .hero-parallax { min-height: auto; height: auto; padding: 20px 0; }
      .hero-content h2 { font-size: 1.6rem !important; margin-bottom: 12px; }
      .hero-content .lead { font-size: 1rem !important; margin-bottom: 20px; }
      .hero-btn { padding: 10px 28px !important; font-size: 1rem !important; }
      .hero-logo-wrap { padding: 16px 20px; margin-top: 20px; }
      .hero-logo-wrap img { height: 100px; }
      .premium-container { padding: 0 20px !important; }
      .banner-content { left: 20px !important; bottom: 20px !important; }
      .banner-content h3 { font-size: 1.5rem !important; }
    }

    @media (max-width: 576px) {
      .hero-content h2 { font-size: 1.35rem !important; }
      .hero-logo-wrap img { height: 80px; }
      .section-header h2 { font-size: 1.6rem !important; }
    }

    /* Bootstrap overrides */
    .text-primary { color: var(--accent) !important; }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--text);
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
      color: var(--text);
    }
  </style>
</head>
<body>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- ГЛАВНЫЙ КОНТЕЙНЕР -->
<main class="premium-container">

  <!-- HERO -->
  <section class="hero-parallax">
    <div class="hero-content">
      <div class="d-flex flex-column flex-md-row align-items-center justify-content-between">
        <div class="text-center text-md-start mb-4 mb-md-0">
          <h2 class="fw-bold">Профессиональные инструменты и оборудование</h2>
          <p class="lead">Удобство и надёжность, испытанное в самых тяжёлых условиях</p>
          <a href="#categories" class="hero-btn">
            <i class="bi bi-arrow-down"></i>Смотреть категории
          </a>
        </div>
        <div class="ms-md-5">
          <div class="hero-logo-wrap">
            <img th:src="@{/whiteTextLogo.png}" alt="18Вольт">
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- КАТЕГОРИИ -->
  <section id="categories">
    <div class="section-header">
      <h2>Категории инструментов</h2>
      <p>Выберите нужную категорию для поиска инструмента</p>
    </div>

    <div th:if="${not #lists.isEmpty(allCategories)}" class="row">
      <div class="col-xl-3 col-lg-4 col-md-6 mb-4" th:each="category : ${allCategories}">
        <div class="category-card">
          <a th:href="@{/category/{title}(title=${category.title})}" class="text-decoration-none">
            <div class="card border-0 shadow-sm h-100">
              <div class="card-body d-flex flex-column">
                <div class="text-center mb-3" style="min-height: 150px; display: flex;
                align-items: center; justify-content: center;">
                  <div th:if="${category.thumbnailUrl != null and !category.thumbnailUrl.isEmpty()}">
                    <img th:src="${category.thumbnailUrl}"
                         th:alt="${category.name}"
                         class="img-fluid rounded"
                         style="max-width: 100%; max-height: 120px; object-fit: contain;">
                  </div>
                  <div th:if="${category.imageUrl != null and !category.imageUrl.isEmpty()
                            and (category.thumbnailUrl == null or category.thumbnailUrl.isEmpty())}">
                    <img th:src="${category.imageUrl}"
                         th:alt="${category.name}"
                         class="img-fluid rounded"
                         style="max-width: 100%; max-height: 120px; object-fit: contain;">
                  </div>
                  <div th:if="${(category.thumbnailUrl == null or category.thumbnailUrl.isEmpty())
                            and (category.imageUrl == null or category.imageUrl.isEmpty())}">
                    <div class="category-icon-placeholder rounded d-flex align-items-center justify-content-center">
                      <i class="bi bi-folder-fill text-primary fs-1"></i>
                    </div>
                  </div>
                </div>
                <h5 class="card-title text-center" th:text="${category.name}">Название категории</h5>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>

    <!-- Пусто -->
    <div th:if="${#lists.isEmpty(allCategories)}" class="empty-state-premium">
      <i class="bi bi-grid"></i>
      <h3>Категории пока не добавлены</h3>
      <p>Администратор должен добавить категории товаров</p>
    </div>
  </section>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: #site-footer}"></div>

<!-- Скрипты -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
