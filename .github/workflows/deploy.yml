name: Deploy with Docker Hub

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: fisher48/tools-market-app  # ← Docker Hub логин/репозиторий

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Build and push Docker image
        run: |
          # Собираем и пушим в Docker Hub
          docker build -t ${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.IMAGE_NAME }}:latest
          
          # Также пушим с тегом по коммиту (опционально)
          docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.TOOLSMARKET_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.TOOLSMARKET_SERVER_HOST }} >> ~/.ssh/known_hosts

      # ======== КОПИРОВАНИЕ ФАЙЛОВ ========
      - name: Copy project files to server
        run: |
          SERVER="${{ secrets.TOOLSMARKET_SERVER_USER }}@${{ secrets.TOOLSMARKET_SERVER_HOST }}"

          # Docker создаёт недостающие bind-mount каталоги под root, после чего
          # scp в них получает Permission denied и весь деплой падает. sudo на
          # сервере нет (его убрали из этого workflow), поэтому права выравнивает
          # сам docker — так любая новая папка под nginx/ больше не чинит вручную.
          #
          # ВАЖНО про кавычки: uid:gid обязан подставить удалённый shell, поэтому
          # аргументы идут в ВНЕШНИХ одинарных кавычках и без sh -c. Вариант с
          # sh -c и '$(id -u)' раскрывал подстановку внутри контейнера, где id -u = 0,
          # и chown отдавал весь nginx под root — деплой падал уже на nginx.conf.
          # test после chown уронит деплой явно, если права не выставились.
          ssh $SERVER 'mkdir -p ~/toolsmarket/nginx/conf.d; U=$(id -u); G=$(id -g); docker run --rm -v ~/toolsmarket/nginx:/t alpine chown -R "$U:$G" /t; test "$(stat -c %u ~/toolsmarket/nginx)" = "$U" || { echo "chown не выставил права — деплой прерван"; exit 1; }; ls -la ~/toolsmarket/nginx'

          scp docker-compose.yml $SERVER:~/toolsmarket/docker-compose.yml
          
          # Копируем nginx конфиг
          echo "Проверяем локальные файлы nginx:"
          ls -la nginx/
          ls -la nginx/conf.d/ 2>/dev/null || echo "Папка conf.d пуста или не существует"

          # 👉 КОПИРУЕМ ВСЮ ПАПКУ
          scp -r nginx $SERVER:~/toolsmarket/

      - name: Deploy application
        run: |
          ssh ${{ secrets.TOOLSMARKET_SERVER_USER }}@${{ secrets.TOOLSMARKET_SERVER_HOST }} "
            set -e
          
            echo '=== Создаем структуру проекта ==='
          
            # Создаем папку
            mkdir -p ~/toolsmarket
          
            cd ~/toolsmarket
          
            echo '✅ Папка создана'
          
            # Показываем что есть
            echo 'Текущая структура:'
            ls -la ~/
          
            echo '=== Начинаем деплой ==='
          
            # Валидируем конфиг nginx ДО остановки сервисов: при ошибке
            # скрипт упадёт на set -e и сайт продолжит работать на старой версии.
            # Проверяющий контейнер обязан быть в compose-сети, иначе
            # nginx -t не найдёт upstream'ы (tools-market-app, grafana,
            # prometheus) и упадёт на host not found in upstream.
            echo 'Проверяем конфигурацию nginx...'
            NET=$(docker network ls -q --filter 'name=app-network' | head -n 1)
            if [ -z "$NET" ]; then
              echo '❌ Не найдена docker-сеть app-network — проверь, что docker compose уже запускался'
              exit 1
            fi
            docker run --rm --network "$NET" \
              -v ~/toolsmarket/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
              -v ~/toolsmarket/nginx/conf.d:/etc/nginx/conf.d:ro \
              -v ~/toolsmarket/nginx/letsencrypt:/etc/letsencrypt:ro \
              nginx:alpine nginx -t
            echo '✅ Конфигурация nginx корректна'
          
            # Останавливаем и удаляем старые контейнеры
            echo 'Останавливаем старые контейнеры...'
            docker compose down || true  # Игнорируем ошибки если нет контейнеров
          
            # Логинимся в Docker Hub (если нужно)
            # echo '${{ secrets.DOCKER_PASSWORD }}' | docker login \
            #   -u '${{ secrets.DOCKER_USERNAME }}' \
            #   --password-stdin
          
            # Обновляем образ (Docker Hub публичный, логин не нужен)
            echo 'Обновляем Docker образ...'
            docker compose pull app
            echo '✅ Образ обновлен'
          
            # Запускаем
            echo 'Запускаем сервисы...'
            docker compose up -d --remove-orphans
            echo '✅ Сервисы запущены'
          
            # Проверяем
            echo 'Проверяем здоровье приложения...'
            sleep 30
            if docker exec tools-market-app curl -f http://localhost:8080/actuator/health; then
              echo '✅ Приложение работает'
            else
              echo '❌ Ошибка health check'
              docker compose logs app --tail=20
              exit 1
            fi
          
            # Очищаем
            echo 'Очищаем старые образы...'
            docker image prune -f
            docker system prune -f
            echo '✅ Очистка завершена'
          
            echo '🎉 Деплой успешно завершен!'
          "